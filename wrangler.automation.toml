name = "atriveo-site"
main = "worker.ts"
compatibility_date = "2026-08-25"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = true

[[durable_objects.bindings]]
name = "BUILDINGS"
class_name = "LivingBuilding"

[[migrations]]
tag = "living-building-v1"
new_sqlite_classes = ["LivingBuilding"]
